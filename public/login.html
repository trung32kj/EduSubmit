<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Bài tập ảnh chứng minh</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="narrow" style="padding-top:12vh">
  <div class="card stack">
    <h1>Bài tập ảnh chứng minh</h1>
    <p class="muted small" style="margin:0">Đăng nhập dành cho giáo viên. Học viên nộp bài qua link riêng của từng bài tập, không cần tài khoản.</p>

    <form id="form" class="stack" novalidate>
      <div>
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div id="alert" class="alert" role="alert"></div>
      <button type="submit" class="primary big" id="submit">Đăng nhập</button>
    </form>

    <details class="raw">
      <summary>Chưa có tài khoản?</summary>
      <p class="small muted">Mở terminal tại thư mục project và chạy <code class="mono">npm run create-admin</code>. Lệnh đó cũng dùng để đổi mật khẩu.</p>
    </details>
  </div>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
